services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql

  postgres-test:
    image: postgres:18-alpine
    shm_size: 256mb
    environment:
      POSTGRES_DB: barber_saas_test
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d barber_saas_test']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_test_data:/var/lib/postgresql

  mailpit:
    image: axllent/mailpit:v1.28
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

volumes:
  postgres_data:
  postgres_test_data:
