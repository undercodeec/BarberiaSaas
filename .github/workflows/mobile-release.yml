name: Mobile Android release

on:
  workflow_dispatch:

jobs:
  android-release:
    name: AAB Android verificado
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_API_ALLOWED_HOSTS: ${{ vars.MOBILE_API_ALLOWED_HOSTS }}
      EXPO_PUBLIC_API_URL: ${{ vars.MOBILE_API_URL }}
      EXPO_PUBLIC_APP_ENV: production
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Confirmar commit de main reproducible
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "main"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD
      - run: pnpm install --frozen-lockfile
      - name: Preflight Mobile
        env:
          NODE_ENV: test
        run: |
          pnpm --filter @barber-saas/mobile typecheck
          pnpm --filter @barber-saas/mobile test
          pnpm --filter @barber-saas/mobile verify:ios-release-config
      - name: Preparar keystore de upload
        shell: bash
        env:
          NAVA_UPLOAD_KEYSTORE_BASE64: ${{ secrets.NAVA_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$NAVA_UPLOAD_KEYSTORE_BASE64"
          printf '%s' "$NAVA_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nava-upload.jks"
      - name: Construir AAB firmado
        working-directory: apps/mobile/android
        env:
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
          NAVA_UPLOAD_CERT_SHA256: ${{ vars.NAVA_UPLOAD_CERT_SHA256 }}
          NAVA_UPLOAD_KEY_ALIAS: ${{ secrets.NAVA_UPLOAD_KEY_ALIAS }}
          NAVA_UPLOAD_KEY_PASSWORD: ${{ secrets.NAVA_UPLOAD_KEY_PASSWORD }}
          NAVA_UPLOAD_STORE_PASSWORD: ${{ secrets.NAVA_UPLOAD_STORE_PASSWORD }}
        run: >-
          ./gradlew :app:bundleRelease --no-daemon
          -PNAVA_UPLOAD_STORE_FILE="$RUNNER_TEMP/nava-upload.jks"
          -PNAVA_UPLOAD_KEY_ALIAS="$NAVA_UPLOAD_KEY_ALIAS"
          -PNAVA_UPLOAD_STORE_PASSWORD="$NAVA_UPLOAD_STORE_PASSWORD"
          -PNAVA_UPLOAD_KEY_PASSWORD="$NAVA_UPLOAD_KEY_PASSWORD"
          -PNAVA_UPLOAD_CERT_SHA256="$NAVA_UPLOAD_CERT_SHA256"
      - name: Inspeccionar firma release
        working-directory: apps/mobile/android
        env:
          NAVA_UPLOAD_CERT_SHA256: ${{ vars.NAVA_UPLOAD_CERT_SHA256 }}
          NAVA_UPLOAD_KEY_ALIAS: ${{ secrets.NAVA_UPLOAD_KEY_ALIAS }}
          NAVA_UPLOAD_KEY_PASSWORD: ${{ secrets.NAVA_UPLOAD_KEY_PASSWORD }}
          NAVA_UPLOAD_STORE_PASSWORD: ${{ secrets.NAVA_UPLOAD_STORE_PASSWORD }}
        run: >-
          ./gradlew :app:signingReport --no-daemon
          -PNAVA_UPLOAD_STORE_FILE="$RUNNER_TEMP/nava-upload.jks"
          -PNAVA_UPLOAD_KEY_ALIAS="$NAVA_UPLOAD_KEY_ALIAS"
          -PNAVA_UPLOAD_STORE_PASSWORD="$NAVA_UPLOAD_STORE_PASSWORD"
          -PNAVA_UPLOAD_KEY_PASSWORD="$NAVA_UPLOAD_KEY_PASSWORD"
          -PNAVA_UPLOAD_CERT_SHA256="$NAVA_UPLOAD_CERT_SHA256"
      - name: Verificar candidata Android
        env:
          NAVA_UPLOAD_CERT_SHA256: ${{ vars.NAVA_UPLOAD_CERT_SHA256 }}
        run: >-
          pnpm --filter @barber-saas/mobile verify:android-release
          --manifest apps/mobile/android/app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml
          --aab apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
      - name: Archivar AAB y SHA-256
        id: archive
        shell: bash
        run: |
          version="$(node -p "require('./apps/mobile/app.json').expo.version")"
          code="$(node -p "require('./apps/mobile/app.json').expo.android.versionCode")"
          name="Nava-${version}-code${code}.aab"
          cp apps/mobile/android/app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/$name"
          sha256sum "$RUNNER_TEMP/$name" > "$RUNNER_TEMP/$name.sha256"
          printf 'name=%s\n' "$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: nava-android-${{ steps.archive.outputs.name }}
          path: |
            ${{ runner.temp }}/${{ steps.archive.outputs.name }}
            ${{ runner.temp }}/${{ steps.archive.outputs.name }}.sha256
          if-no-files-found: error
